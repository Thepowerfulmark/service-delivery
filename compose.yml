services:
  go:
    build: ./apps/go
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      APP_MESSAGE: ${APP_MESSAGE:-hello}

  python:
    build: ./apps/python
    ports:
      - "8082:8082"
    environment:
      PORT: "8082"
      APP_MESSAGE: ${APP_MESSAGE:-hello}

  frontend:
    build: ./apps/frontend
    ports:
      - "8080:8080"
