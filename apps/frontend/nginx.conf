worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 128;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
